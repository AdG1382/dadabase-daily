name: Rebuild website

# Runs when the jokes or the code change, so edits show up on the site without waiting for the next post.
on:
  push:
    branches: [main]
    paths:
      - "data/jokes.csv"
      - "data/seasons.json"
      - "dadabase/**"
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: dadabase-post
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SHOP_URL: ${{ vars.SHOP_URL }}
        run: python -m dadabase build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
