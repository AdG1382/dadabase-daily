name: Post daily joke

on:
  schedule:
    - cron: "17 3 * * *"   # 08:47 IST: Instagram carousel
    - cron: "23 13 * * *"  # 18:53 IST: YouTube Short + Instagram Reel
  workflow_dispatch:
    inputs:
      slot:
        description: "What to post"
        type: choice
        options: [carousel, short]
        default: carousel
      publish:
        description: "Actually post to Instagram/YouTube (untick to only render and update the website)"
        type: boolean
        default: true

concurrency:
  group: dadabase-post
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      SHOP_URL: ${{ vars.SHOP_URL }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Work out which slot this is
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 3 * * *" ]; then
            echo "slot=carousel" >> "$GITHUB_OUTPUT"
          else
            echo "slot=short" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick joke and render media + website
        run: python -m dadabase post --slot "${{ steps.slot.outputs.slot }}" --stage render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Post to Instagram and YouTube
        if: github.event_name == 'schedule' || inputs.publish
        run: python -m dadabase post --slot "${{ steps.slot.outputs.slot }}" --stage publish

      - name: Save posting history
        if: always()
        run: |
          git config user.name "dadabase-bot"
          git config user.email "dadabase-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Posted ${{ steps.slot.outputs.slot }} $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet && git push
          fi
