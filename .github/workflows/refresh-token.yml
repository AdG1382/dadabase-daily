name: Refresh Instagram token

# Instagram tokens last 60 days; this swaps in a fresh one every week.
on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 10:11 IST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No Instagram token yet; nothing to refresh"; exit 0; fi
          python -m dadabase refresh-ig-token --out build/ig_token.txt
      - name: Store the new token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -s build/ig_token.txt ]; then exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT secret missing, so the refreshed token can't be saved. Add it (see README)."
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < build/ig_token.txt
          rm -f build/ig_token.txt
          echo "Saved refreshed Instagram token"
